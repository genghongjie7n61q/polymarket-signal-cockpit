services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in dev-2 .env}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    ports:
      - "127.0.0.1:${DEV2_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: rust:1.87-bookworm
    network_mode: host
    working_dir: /workspace
    command: cargo run -p polymarket-backend --locked
    environment:
      CARGO_HOME: /cargo
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      POLY_ENV: ${POLY_ENV:-local}
      RUST_LOG: ${RUST_LOG:-info,polymarket_backend=debug}
      APP_VERSION: ${APP_VERSION:-0.1.0-dev2}
      APP_HOST: 0.0.0.0
      APP_PORT: ${DEV2_APP_PORT:-8080}
      SUPPORTED_MARKETS: ${SUPPORTED_MARKETS:-btc5m,eth15m}
      DATABASE_URL: postgres://${POSTGRES_USER:-polymarket}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in dev-2 .env}@127.0.0.1:${DEV2_POSTGRES_HOST_PORT:-15432}/${POSTGRES_DB:-polymarket}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in dev-2 .env}
      COINBASE_WS_PROXY: ${COINBASE_WS_PROXY:-}
      POLYMARKET_HTTP_PROXY: ${POLYMARKET_HTTP_PROXY:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    volumes:
      - .:/workspace
      - ${HOME}/.cache/polymarket-cargo/cargo:/cargo
      - ${HOME}/.cache/polymarket-cargo/target:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:22-bookworm
    network_mode: host
    working_dir: /workspace/web
    command: sh -lc "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port ${DEV2_WEB_PORT:-5173}"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://192.168.103.157:8080/api}
    volumes:
      - .:/workspace
      - ${HOME}/.cache/polymarket-node:/root/.npm
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
