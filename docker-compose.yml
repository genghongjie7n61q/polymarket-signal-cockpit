services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POLY_ENV: ${POLY_ENV:-local}
      RUST_LOG: ${RUST_LOG:-info}
      APP_VERSION: ${APP_VERSION:-0.1.0-dev}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      SUPPORTED_MARKETS: ${SUPPORTED_MARKETS:-btc5m,eth15m}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
